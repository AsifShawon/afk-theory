name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity, and a
# paused project means checkout falls back to WhatsApp. This reads one public
# row every three days. It uses the publishable key, which can only read what
# the public site already shows.
#
# Setup: GitHub > Settings > Secrets and variables > Actions > New repository
# secret: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (the same values as the
# Cloudflare build). GitHub turns off scheduled workflows in repositories with
# no commits for 60 days; it emails you first, and one click turns it back on.

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one settings row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as repository secrets to keep Supabase awake."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
