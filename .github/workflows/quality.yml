name: Quality & Storefront Validation

on:
  push:
    branches: [main, "refactor/*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  static-quality:
    name: Static Quality & Storefront Parity Validation
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_afk_theory_static_ci_fixture"
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://localhost:9000"
      NEXT_PUBLIC_BASE_URL: "http://localhost:8000"
      NEXT_PUBLIC_DEFAULT_REGION: "bd"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10.11.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js 20.19.0 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: |
          PNPM_VER=$(pnpm --version)
          echo "Installed pnpm: $PNPM_VER"
          if [ "$PNPM_VER" != "10.11.1" ]; then
            echo "Error: Expected pnpm 10.11.1, found $PNPM_VER"
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify Architecture & Monorepo Boundaries
        run: pnpm run check:architecture

      - name: Type Check Monorepo
        run: pnpm run type-check

      - name: Lint Workspace
        run: pnpm run lint

      - name: Bangladesh Delivery & Contract Unit Tests
        run: pnpm --filter @dtc/commerce-contracts test

      - name: Shared Storefront UI Transition & Interaction Tests
        run: pnpm --filter @dtc/storefront-ui test

      - name: Production Storefront Build Check
        run: pnpm --filter @dtc/storefront build

      - name: Verify Clean Repository & No Whitespace Errors
        run: git diff --check
